[phases.setup]
nixPkgs = ["python310", "nodejs_20"]

[phases.install]
cmds = [
  "cd frontend && npm ci",
  "python3 -m venv /opt/venv",
  ". /opt/venv/bin/activate && pip install -r backend/requirements.txt",
]

[phases.build]
cmds = [
  "cd frontend && VITE_API_URL= npm run build",
  "rm -rf backend/static",
  "cp -r frontend/dist backend/static",
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
